name: Build docker image

on:
  push:
    branches:
      - main

    tags:
      - '*'
      - '!*-r[0-9]*'

  pull_request:

env:
  PROMETHEUS313: '3.13.3'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      prometheus-versions: ${{ steps.set-matrix.outputs.prometheus-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "prometheus313", "version": "${{ env.PROMETHEUS313 }}", "latest": "1", "latest_major": "1"}
          ]
          EOF
          echo "prometheus-versions=$(jq -c . versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      matrix:
        prometheus: ${{ fromJson(needs.setup.outputs.prometheus-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        env:
          PROMETHEUS_VER: ${{ matrix.prometheus.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push architecture image
        if: github.event_name == 'push'
        env:
          PROMETHEUS_VER: ${{ matrix.prometheus.version }}
          ARCH: ${{ matrix.arch }}
        run: make push

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        prometheus: ${{ fromJson(needs.setup.outputs.prometheus-versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.prometheus.version }}
          latest: ${{ matrix.prometheus.latest }}
          latest_major: ${{ matrix.prometheus.latest_major }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@412e2d9ce29c41835ff653b0945bba72eabd9efb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
